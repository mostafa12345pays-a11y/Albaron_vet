<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albaron Vet - نظام إدارة العيادات البيطرية</title>
  <meta name="google-site-verification" content="aAudum6THThu3TCTAIBMzgcTnMhfbilhGpX8DqBKAyI" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --primary: #005b66;
      --primary-dark: #003d45;
      --bg: #f4f8f8;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); }
    .navbar-custom { background-color: var(--primary); color: white; }
    .card-kpi { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .btn-custom { background-color: var(--primary); color: white; }
    .btn-custom:hover { background-color: var(--primary-dark); color: white; }
    .nav-pills .nav-link.active { background-color: var(--primary); }
    .nav-pills .nav-link { color: var(--primary); font-weight: bold; }
    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #005b66 0%, #003d45 100%);
    }
    .app-logo { max-height: 90px; object-fit: contain; }
    .navbar-logo { max-height: 40px; object-fit: contain; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول والتوثيق -->
  <div id="authScreen">
    <div class="card card-kpi p-4 shadow-lg text-center" style="width: 100%; max-width: 480px;">
      <div class="mb-3">
        <img src="https://i.ibb.co/3yk5Q6y/logo.png" alt="Albaron Vet Logo" class="app-logo mb-2 rounded shadow-sm" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3048/3048122.png'">
        <h3 style="color: var(--primary);" class="fw-bold mt-2"><i class="fa-solid fa-paw me-2"></i>Albaron Vet</h3>
        <p class="text-muted small">نظام إدارة العيادات البيطرية المخصص</p>
      </div>

      <!-- أزرار التبديل -->
      <div class="d-flex gap-2 w-100 mb-3">
        <button type="button" class="btn btn-dark flex-fill fw-bold" id="tabBtnLogin" onclick="switchTab('login')">تسجيل الدخول</button>
        <button type="button" class="btn btn-outline-dark flex-fill fw-bold" id="tabBtnRegister" onclick="switchTab('register')">إنشاء حساب جديد</button>
      </div>

      <!-- نموذج تسجيل الدخول بالبريد الإلكتروني -->
      <div id="loginSection">
        <form id="loginForm">
          <div class="mb-3 text-start">
            <label class="form-label fw-bold">البريد الإلكتروني</label>
